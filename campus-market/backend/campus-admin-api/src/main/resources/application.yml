# ════════════════════════════════════════════════════════════
# 基础配置：与环境无关的部分，四个 profile 共用
#
# 环境相关（连接地址、账号密码、日志级别、Knife4j 开放程度）全部下沉到：
#   application-demo.yml   演示环境【入库】localhost + 演示凭据，clone 即可跑
#   application-dev.yml    本地开发【已 gitignore】
#   application-prod.yml   生产环境【已 gitignore】取值全部来自环境变量
#
# 默认激活 demo：仓库里只有 demo 配置，保证拉下来就能启动。
# 本地开发启动时指定：-Dspring.profiles.active=dev
# ════════════════════════════════════════════════════════════

spring:
  application:
    name: campus-market
  profiles:
    # 保持 demo：application-dev.yml 已 gitignore、不入库，默认激活 dev 会让
    # clone 下来的人缺数据源配置而启动失败。本机开发请在 IDEA 的 Run Configuration
    # 里配 VM options -Dspring.profiles.active=dev（配一次即可，长期生效）。
    active: demo
  threads:
    virtual:
      enabled: false # JDK 21 虚拟线程：评估后不启用，见 tech/01 2.1
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  # 不启用 MP 的 logic-delete：本项目的 deleted 是删除时间戳而非 0/1，
  # 唯一索引带 deleted，查询统一显式带 deleted = 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 全局配置（两个 StpLogic 的差异化配置在 MultiAccountConfig 里单独 set）
# 会话持久层由 sa-token-redis-jackson 自动接管，重启不掉登录，且支持封禁后即时踢下线
sa-token:
  token-name: satoken
  token-style: uuid
  is-read-body: false
  is-read-header: true
  is-read-cookie: false

# Knife4j 文档：默认开放（开发/演示），生产环境在 application-prod.yml 里关掉
knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
springdoc:
  group-configs:
    - group: "学生端"
      paths-to-match: "/api/**"
    - group: "管理端"
      paths-to-match: "/admin/**"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
