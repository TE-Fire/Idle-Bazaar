# RocketMQ broker 配置（宿主机开发用，非生产配置）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 开发环境开启，省去手动创建 topic 的麻烦；生产必须关掉
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 容器内的 IP 对宿主机不可达，写 127.0.0.1 让客户端走端口映射
brokerIP1 = 127.0.0.1
listenPort = 10911

# 延迟消息：30 分钟超时取消订单用到 level 18（30m）
# RocketMQ 内置等级 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
